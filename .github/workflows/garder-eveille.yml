# Garde le service Render éveillé (plan gratuit = mise en veille après ~15 min sans visite).
# GitHub appelle /api/sante toutes les 10 minutes ; Render compte cet appel comme une visite.
# L'adresse de l'app se règle dans GitHub : Settings > Secrets and variables > Actions >
# onglet « Variables » > APP_URL (ex. https://air-zen-flow.onrender.com).
# Attention : GitHub n'exécute les tâches planifiées que depuis la branche par défaut du dépôt.
name: Garder Render éveillé

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # bouton « Run workflow » pour tester à la main

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Appeler /api/sante
        env:
          APP_URL: ${{ vars.APP_URL || 'https://air-zen-flow.onrender.com' }}
        run: |
          # Plusieurs essais : au réveil, Render peut mettre jusqu'à une minute à répondre.
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors \
            --max-time 90 "${APP_URL%/}/api/sante"
